services:
  banana-import:
    build: .
    ports:
      - "127.0.0.1:8500:8500"
    env_file:
      - .env
    volumes:
      # Persist per-client learned vendor→account maps across rebuilds.
      - ./data:/app/data
      # DESK-65 bridge: the synced SharePoint/OneDrive libraries that hold clients' .ac2
      # (read+write — book writes back). Host paths in .env (BANANA_SP_HOST/BANANA_COMM_HOST);
      # inside the container they are the BANANA_FILE_ROOTS, searched recursively by /book.
      - "${BANANA_SP_HOST:-/tmp}:/banana-files/sharepoint"
      - "${BANANA_COMM_HOST:-/tmp/comm}:/banana-files/comm"
    extra_hosts:
      # Lets the container reach the Banana webserver on the host (live chart of accounts).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - "autoheal=true"   # restarted by the shared autoheal sidecar when unhealthy
    healthcheck:  # detects a stale ExFAT mount (os.listdir throws) AND an app hang
      test: ["CMD-SHELL", "python -c \"import os,sys,urllib.request; os.listdir('/app/data'); sys.exit(0 if urllib.request.urlopen('http://localhost:8500/api/version',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
